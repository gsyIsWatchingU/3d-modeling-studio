version: '3.8'

services:
  3d-modeling-studio:
    build: .
    container_name: 3d-modeling-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./public:/app/public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/db.json
      - UPLOAD_DIR=/data/uploads
      - MODEL_DIR=/data/models
      - SPU_PROVIDER=forge3d
      - SPU_API_URL=${SPU_API_URL:-http://host.docker.internal:8091/v1/jobs}
      - SPU_API_KEY=${SPU_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
