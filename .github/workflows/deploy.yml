name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: 构建检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 检查语法
        run: node --check server/index.js

      - name: 生成部署包
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/3d-modeling-studio-${GITHUB_SHA}.tar.gz"
          trap 'rm -f .deploy-manifest' EXIT
          git ls-files | grep -v '^data/' > .deploy-manifest
          tar --verbatim-files-from -czf "$archive" -T .deploy-manifest .deploy-manifest

      - name: 上传部署包
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: 3d-modeling-studio-${{ github.sha }}
          path: ${{ runner.temp }}/3d-modeling-studio-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: 部署到 GPU 服务器
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_PATH: /workspace/projects/3d-modeling-studio
    steps:
      - name: 下载部署包
        uses: actions/download-artifact@v4
        with:
          name: 3d-modeling-studio-${{ github.sha }}
          path: ${{ runner.temp }}/3d-modeling-studio-release

      - name: 检查部署目标
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" == "/workspace/projects/3d-modeling-studio" ]]
          test -d "$DEPLOY_PATH"

      - name: 发布并验证
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ARCHIVE="$RUNNER_TEMP/3d-modeling-studio-release/3d-modeling-studio-${GITHUB_SHA}.tar.gz"
          [[ "$DEPLOY_PATH" == "/workspace/projects/3d-modeling-studio" ]]
          release_name="$(basename "$DEPLOY_ARCHIVE")"
          release_name="${release_name#3d-modeling-studio-}"
          release_name="${release_name%.tar.gz}"
          if [[ ! "$release_name" =~ ^[0-9a-f]{40}$ ]]; then
            echo "非法发布版本：$release_name" >&2
            exit 1
          fi
          release_dir="$DEPLOY_PATH/.deploy-tmp/release-$release_name"
          [[ "$release_dir" == "$DEPLOY_PATH/.deploy-tmp/release-$GITHUB_SHA" ]]

          test -f "$DEPLOY_ARCHIVE"
          mkdir -p "$DEPLOY_PATH/.deploy-tmp"
          rm -rf -- "$release_dir"
          mkdir -p "$release_dir"
          trap 'rm -f "$DEPLOY_ARCHIVE"; rm -rf -- "$release_dir"' EXIT
          tar -xzf "$DEPLOY_ARCHIVE" -C "$release_dir"
          bash "$release_dir/deploy/apply-release.sh" "$release_dir" "$DEPLOY_PATH"

          cd "$DEPLOY_PATH"
          bash deploy/start.sh
          bash deploy/verify-public.sh
          printf '%s\n' "$release_name" > "$DEPLOY_PATH/run/deployed-commit"
          echo "已部署并验证版本：$release_name"
