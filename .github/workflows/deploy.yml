name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    env:
      PATH: /workspace/.tools/node-v20/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npm ci
        run: npm ci --production

      - name: Check syntax
        run: node --check server/index.js

      - name: Deploy to server
        run: |
          set -euo pipefail
          mkdir -p /workspace/projects/3d-modeling-studio
          mkdir -p /workspace/data/3d-modeling-studio/uploads
          mkdir -p /workspace/data/3d-modeling-studio/models
          mkdir -p /workspace/logs/3d-modeling-studio
          cp -r . /workspace/projects/3d-modeling-studio/

      - name: Start service
        run: |
          cd /workspace/projects/3d-modeling-studio
          bash deploy/start.sh

      - name: Verify public site
        run: |
          set -euo pipefail
          # 从 cloudflared 日志里解析当前公网域名
          BASE=$(grep -hoE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
            /workspace/logs/3d-modeling-studio/cloudflared.out.log \
            /workspace/logs/3d-modeling-studio/cloudflared.err.log 2>/dev/null | tail -1)
          if [[ -z "$BASE" ]]; then
            echo "failed to resolve public URL from cloudflared logs" >&2
            exit 1
          fi
          echo "public URL: $BASE"
