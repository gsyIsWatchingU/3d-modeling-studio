[program:3d-modeling-studio]
command=/workspace/projects/3d-modeling-studio/deploy/start.sh
directory=/workspace/projects/3d-modeling-studio
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
priority=240
stdout_logfile=/workspace/logs/3d-modeling-studio/out.log
stderr_logfile=/workspace/logs/3d-modeling-studio/err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PATH="/usr/local/bin/node:/usr/bin:%(ENV_PATH)s"
