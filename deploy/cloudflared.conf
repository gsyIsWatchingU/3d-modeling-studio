[program:cloudflared-3d-modeling-studio]
command=/workspace/.tools/bin/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3300
directory=/workspace/projects/3d-modeling-studio
environment=TZ="Asia/Shanghai"
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
priority=241
stdout_logfile=/workspace/logs/3d-modeling-studio/cloudflared.out.log
stderr_logfile=/workspace/logs/3d-modeling-studio/cloudflared.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
